name: typescript

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Typecheck tests
        run: npm run typecheck
      - name: Test (spec vectors, Rekor/RFC 3161 fixtures, tamper tests)
        run: npm test

  interop:
    # Cross-language: Python SDK bundle verified by the TypeScript verifier and vice versa,
    # plus differential tests of canonical bytes and reports against the Python reference.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          # 3.10: the strictest datetime.fromisoformat grammar the reference supports, which the
          # TypeScript verifier implements; the timestamp differential test runs in full there.
          python-version: "3.10"
      - name: Install
        run: |
          npm ci
          uv sync --all-packages
      - name: Build
        run: npm run build
      - name: Differential tests against the Python reference
        run: npm test
        env:
          GLEIPNIR_REQUIRE_PYTHON: "1"
      - name: Interop (Python <-> TypeScript bundles)
        run: npm run interop
