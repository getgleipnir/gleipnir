[tool.uv.workspace]
members = ["python/gleipnir-verify", "python/gleipnir"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP007"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint.isort]
known-first-party = ["gleipnir", "gleipnir_verify"]

[tool.ruff.lint.flake8-bugbear]
# Outcome-check specs are immutable callables, safe as argument defaults.
extend-immutable-calls = [
  "gleipnir.outcomes._core.arg", "gleipnir.outcomes._core.opt_arg", "gleipnir.outcomes._core.resp",
  "gleipnir.outcomes._core.const", "gleipnir.outcomes._core.first_of",
]
