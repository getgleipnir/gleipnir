[project]
name = "gleipnir-verify"
version = "0.1.0.dev0"
description = "Offline verifier for Gleipnir agent action record bundles"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Gleipnir" }]
dependencies = [
  "cryptography>=42",
  "rfc8785>=0.1.4",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://getgleipnir.com"
Source = "https://github.com/getgleipnir/gleipnir"

[project.scripts]
gleipnir-verify = "gleipnir_verify.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gleipnir_verify"]
