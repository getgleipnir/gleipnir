# AI Agent Security Review Checklist
#
# Source of truth. checklist.md, checklist.csv and mappings/*.md are generated
# from this file by scripts/build.py. Edit here, then run:
#   python scripts/build.py
#
# Item IDs are stable. Never renumber or reuse an ID; deprecate instead.

version: 0.1.0
updated: 2026-10-14

groups:
  - id: ACC
    title: Access & scope
    summary: What the agent can do in the buyer's systems, under which identity, and how that is enforced.
  - id: ACT
    title: Action records
    summary: What is recorded for each agent action, and whether one action can be produced end to end.
  - id: OUT
    title: Outcome verification
    summary: Whether what the agent reports matches what actually happened in the system of record.
  - id: TMP
    title: Tamper evidence
    summary: Whether records can be changed after the fact without anyone noticing, and who can check.
  - id: INC
    title: Incident reconstruction
    summary: Detecting, reporting, stopping and reconstructing what went wrong.
  - id: RET
    title: Retention
    summary: How long records are kept, by whom, and how the buyer gets them.
  - id: CHG
    title: Model & prompt changes
    summary: Which models run, how changes are controlled, and how behaviour is monitored over time.
  - id: DAT
    title: Data handling
    summary: Training use, retention and deletion of buyer data, including inside agent records.
  - id: HUM
    title: Human oversight (as the buyer defines it)
    summary: Evidence that the oversight model the buyer chose was actually followed.
  - id: SUB
    title: Sub-processors
    summary: Model, voice and tool providers behind the agent, and the buyer's audit and regulator rights.

