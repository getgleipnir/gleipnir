  - id: INC-03
    group: INC
    origin: buyer-question
    question: How quickly can we stop the agent, or roll it back to a previous model or configuration?
    why: When something goes wrong the first question is how to stop it. Rollback also matters when a provider changes a model underneath you.
    evidence:
      - A kill switch the buyer can trigger, with tested time to effect.
      - Pinned model and prompt versions with a documented rollback path.
      - Results of the last rollback test.
    not_enough:
      - "Contact support."
    strong_answer: >-
      Gives the buyer a kill switch it can trigger itself with a tested time to effect, and a documented rollback
      path to a pinned earlier model, prompt and configuration.
    template_answer: >-
      You can stop the agent yourself via [console button / API / revoking credential], taking effect within [time]
      (tested [date]). Model, prompt and configuration versions are pinned, and we can roll back to [previous
      version] within [time]. Results of the last stop and rollback test are attached.
    scanner:
      check: >-
        Can the buyer stop the agent themselves (a kill switch), with a tested time to take effect, and can you roll
        back to a previous version?
      gap: >-
        When something goes wrong, the first question is how fast it can be stopped. "Contact support" is not an
        answer a bank accepts.
    often_unevidenced: false
    capabilities: []
    references:
      - {fw: eu_ai_act, ref: "Art. 14(4)(e)", note: "Ability to interrupt the system with a stop procedure (high-risk)", confidence: verified, url: "https://artificialintelligenceact.eu/article/14/"}
      - {fw: nist_rmf, ref: MANAGE 2.4, note: "Mechanisms to supersede, disengage or deactivate", confidence: verified}
      - {fw: nist_600_1, ref: MG-2.4-002 / MG-2.4-004, note: "Escalation and deactivation criteria", confidence: verified}
      - {fw: aicm, ref: CCC-09, note: "Change restoration", confidence: title-only}
      - {fw: finos, ref: AIR-PREV-010, note: "Model version pinning", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-10_ai-model-version-pinning.html"}
      - {fw: iso42001, ref: A.6.2.5, note: "AI system deployment plan", confidence: secondary}
      - {fw: dora, ref: "Art. 28(7)-(8); Art. 30(3)(f)", note: "Termination rights, exit plans and transition", confidence: verified, url: "https://www.digital-operational-resilience-act.com/Article_28.html"}
      - {fw: nydfs500, ref: "500.16(a)", note: "Incident response and continuity plans", confidence: verified, url: "https://www.law.cornell.edu/regulations/new-york/23-NYCRR-500.16"}
      - {fw: soc2, ref: CC7.5, note: "Recover from identified security incidents", confidence: verified}

  # ---------------------------------------------------------------- RET
  - id: RET-01
    group: RET
    origin: buyer-question
    question: What do you log about agent activity, how long do you keep it, who can access it, and can you export it to our SIEM or GRC tool?
    why: Log management is an explicit topic in the deepest tier of bank AI due diligence. Short default retention is a common finding.
    evidence:
      - A list of logged event types for agent actions (not just infrastructure).
      - Retention period per log type.
      - Export mechanism (API or scheduled delivery) and a sample export.
    not_enough:
      - '"Logs retained for 30 days" with no agent-action logs.'
    strong_answer: >-
      Lists the agent-level events logged (not just infrastructure), the retention per log type, who can access
      them, and offers an export into the buyer's SIEM or GRC tool with a sample.
    template_answer: >-
      We log [event types: actions, tool calls, outcomes, reviews, config changes]. Retention: [period per type].
      Access: [roles]. You can receive records via [API / scheduled delivery / your SIEM or object storage] in
      [format]. A sample export is attached.
    scanner:
      check: >-
        Do you log agent-level events (not just infrastructure), with a retention period per log type and an export
        to the buyer's SIEM?
      gap: >-
        Short default retention and infrastructure-only logs are common findings, and they leave the buyer unable to
        monitor the agent.
    often_unevidenced: false
    capabilities: [retention_policy, export]
    references:
      - {fw: fsisac, ref: Level 3, note: "Log management, audit validation and data retention", confidence: verified}
      - {fw: aicm, ref: LOG-01 / LOG-02 / LOG-07, note: "Logging policy, protection and scope", confidence: secondary}
      - {fw: dora, ref: "RTS 2024/1774 Art. 12", note: "Define logged events and retention", confidence: secondary, url: "https://www.springlex.eu/en/packages/dora/rts-rmf-regulation/article-12/"}
      - {fw: iso42001, ref: A.6.2.8, note: "AI system recording of event logs", confidence: secondary}
      - {fw: finos, ref: AIR-DET-004, note: "Centralize AI logs, for example in a SIEM", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-4_ai-system-observability.html"}
      - {fw: nydfs_ai, ref: Monitoring, note: "Monitor user activity and AI tool use", confidence: verified}
      - {fw: sig, ref: AI domain, note: "Domain-level only; question text not reviewed", confidence: title-only}
      - {fw: aiuc1, ref: E015.3, note: "Log storage with defined retention periods, access controls and PII masking", confidence: verified, url: "https://standard.aiuc-1.com/accountability/log-model-activity"}
      - {fw: aarm, ref: R8, note: "Should stream telemetry to SIEM in a standard schema (OCSF, CEF) plus batch export", confidence: verified, url: "https://arxiv.org/abs/2602.09433"}
      - {fw: soc2, ref: CC7.2, note: "Monitor components for anomalies and evaluate them", confidence: verified}

  - id: RET-02
    group: RET
    origin: buyer-question
    question: Can we hold our own copy of the agent's event logs for the period our rules require?
    why: Under the EU AI Act, deployers of high-risk systems must keep the logs that are under their control for at least six months, and financial institutions keep them under their financial-services record rules. A buyer-held copy is how a deployer shows it meets that, rather than depending on the vendor.
    evidence:
      - Continuous or scheduled delivery of records into storage the buyer controls.
      - Format documented so the buyer's copy remains verifiable on its own.
    not_enough:
      - "We can send logs on request."
    strong_answer: >-
      Delivers records continuously or on a schedule into storage the buyer controls, in a documented format that
      stays verifiable without the vendor.
    template_answer: >-
      Records are delivered [continuously / every period] to [your bucket / SIEM / storage], which you control. The
      format is documented ([link]) and each copy can be verified on its own, without access to our systems. You set
      retention there to match your rules.
    scanner:
      check: >-
        Can the buyer hold their own copy of the agent's records for as long as their rules require?
      gap: >-
        Many buyers must keep logs for months or years under their own control. A copy that only lives with you
        doesn't cover that.
    often_unevidenced: true
    capabilities: [buyer_copy, retention_policy]
    references:
      - {fw: eu_ai_act, ref: "Art. 26(6)", note: "Deployer keeps logs at least six months; financial institutions under financial law (high-risk)", confidence: verified, url: "https://artificialintelligenceact.eu/article/26/"}
      - {fw: eu_ai_act, ref: "Art. 19(1)-(2)", note: "Provider keeps logs it controls at least six months", confidence: verified, url: "https://artificialintelligenceact.eu/article/19/"}
      - {fw: eu_ai_act, ref: "Art. 12(1)", note: "Automatic logging over the lifetime", confidence: verified, url: "https://artificialintelligenceact.eu/article/12/"}
      - {fw: nydfs500, ref: "500.6(b)", note: "Covered entity keeps audit-trail records five years", confidence: verified, url: "https://www.law.cornell.edu/regulations/new-york/23-NYCRR-500.6"}
      - {fw: aarm, ref: "Sec. VI.D", note: "Vendor-side integrations must let customers export or receive receipts for their audit trail", confidence: verified, url: "https://arxiv.org/abs/2602.09433"}
    note: EU AI Act Annex III high-risk obligations (including credit scoring and life/health insurance pricing) apply from 2 Dec 2027 after the Digital Omnibus, Regulation (EU) 2026/1744.

  - id: RET-03
    group: RET
    origin: buyer-question
    question: How do we get timely access to our data and to reports on the agent's activity, by type and frequency?
    why: Buyers must be able to monitor the service and to give data to auditors and regulators on demand.
    evidence:
      - Report types and cadence in the contract (activity, failures, incidents, changes).
      - Self-service export of the buyer's data and records.
    not_enough:
      - A dashboard with no export.
    strong_answer: >-
      Names the report types and cadence in the contract and lets the buyer export its own data and records without
      a support ticket.
    template_answer: >-
      You receive [activity, failure, incident and change] reports every [period], as defined in [contract section].
      You can export your data and agent records at any time via [self-service export / API].
    often_unevidenced: false
    capabilities: [pack, export]
    references:
      - {fw: dora, ref: "Art. 30(2)(d)", note: "Access to and return of data in an accessible format", confidence: verified, url: "https://www.digital-operational-resilience-act.com/Article_30.html"}
      - {fw: dora, ref: "RTS 2024/1773 Art. 3", note: "Effective data access for auditors and authorities", confidence: secondary, url: "https://advisera.com/cdr-2024-1773/governance-arrangements/"}
      - {fw: eu_ai_act, ref: "Art. 13(3)(f)", note: "Log collection mechanisms described for deployers", confidence: verified, url: "https://artificialintelligenceact.eu/article/13/"}
      - {fw: iso42001, ref: A.8.5, note: "Information for interested parties", confidence: secondary}
      - {fw: naic, ref: "Sec. 4, 1.1-1.3", note: "Documents regulators may request", confidence: verified}

  - id: RET-04
    group: RET
    origin: derived
    derived_from: RET-01 and RET-02
    question: Does the retention of agent records match our own record-keeping obligations, and what happens to the records when the contract ends?
    why: Vendor defaults (often weeks) rarely match the buyer's retention duties (often years). On exit, the buyer still needs the records.
    evidence:
      - Retention configurable per buyer, set to the buyer's requirement.
      - Exit clause covering return of records in a verifiable format before deletion.
    not_enough:
      - A fixed vendor-wide retention period.
    strong_answer: >-
      Lets each buyer set retention to its own obligations and commits, on exit, to return records in a verifiable
      format before deleting them.
    template_answer: >-
      Retention is configurable per customer; for you it is set to [period] to match [your obligation]. On
      termination we return all records in [format], verifiable without us, within [days], and delete our copies
      after your confirmation, per [contract clause].
    often_unevidenced: false
    capabilities: [retention_policy, buyer_copy]
    references:
      - {fw: nydfs500, ref: "500.6(b)", note: "Five-year retention for covered entities' audit trails", confidence: verified, url: "https://www.law.cornell.edu/regulations/new-york/23-NYCRR-500.6"}
      - {fw: eu_ai_act, ref: "Art. 19(2); Art. 26(6)", note: "Financial institutions keep logs under financial-services documentation rules", confidence: verified, url: "https://artificialintelligenceact.eu/article/26/"}
      - {fw: dora, ref: "Art. 28(8); Art. 30(2)(d)", note: "Exit plans and return of data", confidence: verified, url: "https://www.digital-operational-resilience-act.com/Article_28.html"}
      - {fw: naic, ref: "Sec. 3, 3.6", note: "Data and record retention in the AIS program", confidence: verified}
      - {fw: soc2, ref: C1.2, note: "Dispose of confidential information per objectives (confidentiality, if in scope)", confidence: verified}

  # ---------------------------------------------------------------- CHG
  - id: CHG-01
    group: CHG
    origin: buyer-question
    question: Which foundation models and providers sit behind each feature, and how will you notify us when they change?
    why: The model is the most important sub-component. Silent model swaps change behaviour and can invalidate the buyer's validation.
    evidence:
      - Model and provider list per feature, with versions.
      - Contractual advance notice of model or provider changes.
      - Change log available to the buyer.
    not_enough:
      - "We use leading LLMs."
    strong_answer: >-
      Lists models and providers per feature with versions, commits contractually to advance notice of changes, and
      keeps a change log the buyer can see.
    template_answer: >-
      [Feature]: [provider, model, version]. [Feature]: [provider, model, version]. We give [N days] advance notice
      of any model or provider change, per [contract clause]. The change log is at [link].
    often_unevidenced: false
    capabilities: [model_version]
    references:
      - {fw: fsisac, ref: Level 1, note: "Identify the foundation model", confidence: verified}
      - {fw: nist_600_1, ref: GV-1.6-003; GV-6.2-007, note: "Inventory of models and versions; contracts address liability for changes over time", confidence: verified}
      - {fw: finos, ref: AIR-PREV-007, note: "Contracts cover model versioning and change notification", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-7_legal-and-contractual-frameworks-for-ai-systems.html"}
      - {fw: finos, ref: AIR-PREV-010, note: "Advance notice of new versions and deprecations", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-10_ai-model-version-pinning.html"}
      - {fw: aicm, ref: CCC-05; STA-08; STA-16, note: "Change agreements, supply chain inventory, service BOM", confidence: title-only}
      - {fw: nydfs_ai, ref: Data management, note: "Inventory of all systems that use or rely on AI", confidence: verified}
      - {fw: dora, ref: "Art. 28(3)", note: "Register of ICT third-party arrangements", confidence: verified, url: "https://www.digital-operational-resilience-act.com/Article_28.html"}
      - {fw: iso42001, ref: A.4.4; A.10.3, note: "Tooling resources; suppliers", confidence: secondary}
      - {fw: soc2, ref: CC3.4, note: "Vendor assesses changes that could affect its controls; says nothing about notifying customers", confidence: verified}

  - id: CHG-02
    group: CHG
    origin: buyer-question
    question: How are changes to prompts, agent logic, tools and models tested, approved and versioned before they reach our traffic?
    why: For agents, a prompt edit is a code change. Buyers want the same change control they expect for software.
    evidence:
      - Versioned prompts, tool definitions and configs, with the version stored on each action record.
      - Pre-release evaluation results and a named approver per change.
      - Change history the buyer can review.
    not_enough:
      - Prompts edited in a vendor console with no history.
    strong_answer: >-
      Versions prompts, tools and configs like code, runs evaluations before release with a named approver, stores
      the version on every action record, and gives the buyer a change history it can review.
    template_answer: >-
      Prompts, tool definitions and configs are versioned in [repository]. Every change runs [evaluation suite] and
      needs approval from [role] before release. The active version is stored on each action record. Change history
      for your deployment is available at [link].
    scanner:
      check: >-
        Are prompts, tools and model changes versioned, tested and approved before they reach the buyer's traffic?
      gap: >-
        For agents, a prompt edit is a code change. Without change control, behaviour can shift under the buyer
        without anyone noticing.
    often_unevidenced: false
    capabilities: [config_version]
    references:
      - {fw: fsisac, ref: Level 3, note: "Change management", confidence: verified}
      - {fw: aicm, ref: CCC-01 to CCC-09, note: "Change control and configuration management", confidence: title-only}
      - {fw: nydfs_cl7, ref: "¶17; ¶29", note: "Test on material changes; track changes with approvers", confidence: verified}
      - {fw: dora, ref: "Art. 9(4)", note: "Recorded, tested and approved ICT changes", confidence: verified, url: "https://www.digital-operational-resilience-act.com/Article_9.html"}
      - {fw: iso42001, ref: A.6.2.4; A.6.2.5, note: "Verification and validation; deployment", confidence: secondary}
      - {fw: nist_rmf, ref: MANAGE 4.1, note: "Post-deployment monitoring incl. change management", confidence: verified}
      - {fw: finos, ref: AIR-PREV-005, note: "System acceptance testing", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-5_system-acceptance-testing.html"}
      - {fw: finos, ref: AIR-PREV-025, note: "Skill and plugin integrity", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-25_skill-plugin-integrity-and-governance.html"}
      - {fw: nist_600_1, ref: MS-2.8-003, note: "Version control across the lifecycle (content provenance)", confidence: verified}
      - {fw: aiuc1, ref: E004, note: "Define changes needing approval (model, system prompt, guardrails); named approver and records", confidence: verified, url: "https://standard.aiuc-1.com/accountability/assign-accountability"}
      - {fw: aiuc1, ref: C002, note: "Pre-deployment testing of changes with risk assessment and approval sign-off", confidence: verified, url: "https://standard.aiuc-1.com/safety/conduct-pre-deployment-testing"}
      - {fw: soc2, ref: CC8.1, note: "Changes authorized, designed, tested, approved and documented", confidence: verified}

  - id: CHG-03
    group: CHG
    origin: buyer-question
    question: How is the agent validated, independently or on an ongoing basis, including drift and bias testing?
    why: Banks and insurers apply model risk management to vendor models. They need validation evidence they can file.
    evidence:
      - Validation methodology and latest results, including bias testing where decisions affect consumers.
      - Drift monitoring and re-validation triggers.
      - Any independent validation report.
    not_enough:
      - Marketing benchmark numbers.
    strong_answer: >-
      Shares the validation method and latest results (including bias testing where consumers are affected), drift
      monitoring with re-validation triggers, and any independent validation report.
    template_answer: >-
      We validate [agent / model] using [method]; latest results from [date] are attached, including bias testing on
      [dimensions] where decisions affect consumers. Drift is monitored by [metric]; re-validation is triggered by
      [condition]. [Independent validation by X on date / none yet].
    often_unevidenced: false
    capabilities: []
    references:
      - {fw: fsisac, ref: Level 2, note: "Model validation", confidence: verified}
      - {fw: naic, ref: "Sec. 3, 3.3(c); 3.4", note: "Drift and auditability; validation and retesting", confidence: verified}
      - {fw: nydfs_cl7, ref: "¶15-¶17; ¶32", note: "Testing and independent review", confidence: verified}
      - {fw: nist_rmf, ref: MEASURE 2.3 / 2.5 / 2.11, note: "Performance, validity and fairness", confidence: verified}
      - {fw: aicm, ref: MDS-10; GRC-11; A&A-02, note: "Continuous monitoring, bias assessment, independent assessments", confidence: title-only}
      - {fw: iso42001, ref: A.6.2.4, note: "Verification and validation", confidence: secondary}
      - {fw: finos, ref: AIR-DET-015, note: "LLM-as-a-judge evaluation calibrated to humans", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-15_using-large-language-models-for-automated-evaluation-llm-as-a-judge-.html"}

  - id: CHG-04
    group: CHG
    origin: buyer-question
    question: What ongoing monitoring do you report to us? Performance, error rates, complaints and drift.
    why: Third-party oversight is continuous, not a one-time review. The buyer needs regular data to show its own supervisors.
    evidence:
      - A recurring report with defined metrics and thresholds.
      - Escalation when thresholds are breached.
    not_enough:
      - Ad-hoc updates on request.
    strong_answer: >-
      Sends a recurring report with defined metrics and thresholds (performance, errors, complaints, drift) and
      escalates when a threshold is breached.
    template_answer: >-
      Every [period] you receive a report covering [performance, error rate, mismatch rate, complaints, drift]
      against agreed thresholds. Breaches are escalated to [contact] within [time]. A sample report is attached.
    often_unevidenced: false
    capabilities: [report]
    references:
      - {fw: nist_rmf, ref: GOVERN 1.5; MEASURE 2.4; MANAGE 4.1, note: "Planned and post-deployment monitoring", confidence: verified}
      - {fw: eu_ai_act, ref: "Art. 72", note: "Post-market monitoring by the provider (high-risk)", confidence: verified, url: "https://artificialintelligenceact.eu/article/72/"}
      - {fw: iso42001, ref: A.6.2.6, note: "Operation and monitoring", confidence: secondary}
      - {fw: aicm, ref: MDS-10, note: "Model continuous monitoring", confidence: title-only}
      - {fw: dora, ref: "Art. 30(3)(a)", note: "Precise service levels and reporting", confidence: verified, url: "https://www.digital-operational-resilience-act.com/Article_30.html"}
      - {fw: nydfs_cl7, ref: "¶29-¶30", note: "Monitoring, drift testing and complaints", confidence: verified}
      - {fw: finos, ref: AIR-DET-011, note: "Human feedback loop", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-11_human-feedback-loop-for-ai-systems.html"}
      - {fw: aiuc1, ref: C008, note: "Ongoing monitoring of AI outputs across risk categories", confidence: verified, url: "https://standard.aiuc-1.com/safety/monitor-ai-risk-categories"}

  # ---------------------------------------------------------------- DAT
  - id: DAT-01
    group: DAT
    origin: buyer-question
    question: Is our data used to train or improve any model? How long are prompts, uploads and outputs kept, and how is deletion verified?
    why: The first AI question in almost every questionnaire. Buyers also check that the vendor's model providers make the same commitment.
    evidence:
      - Contract terms on no training and on retention, including for model providers (zero retention where available).
      - Retention schedule per data type.
      - Deletion procedure and a deletion confirmation on request.
    not_enough:
      - A privacy policy page.
    strong_answer: >-
      States in the contract that buyer data is not used for training, by the vendor or its model providers, gives
      the retention per data type, and confirms deletion on request.
    template_answer: >-
      Your data [is not used / is used, under these conditions:] to train or improve any model, by us or by
      [providers], per [contract clause / provider terms]. Retention: prompts [period], uploads [period], outputs
      [period]; [zero-retention terms with providers where available]. Deletion follows [procedure], and we [confirm
      it in writing on request].
    scanner:
      check: >-
        Is it in writing that buyer data is not used for training, by you or your model providers, with retention
        and deletion terms?
      gap: >-
        This is the first AI question in almost every questionnaire. A privacy-policy link usually isn't enough.
    often_unevidenced: false
    capabilities: []
    references:
      - {fw: fsisac, ref: Category 2, note: "Data privacy, retention and deletion", confidence: verified}
      - {fw: nydfs_ai, ref: Data management, note: "Dispose of NPI no longer needed, including NPI used for AI", confidence: verified}
      - {fw: nydfs500, ref: "500.11(b)(4)", note: "Third-party representations and warranties", confidence: verified, url: "https://www.law.cornell.edu/regulations/new-york/23-NYCRR-500.11"}
      - {fw: aicm, ref: DSP-02; DSP-12; DSP-15; DSP-16, note: "Disposal, purpose limitation, production data use, retention and deletion", confidence: title-only}
      - {fw: dora, ref: "Art. 30(2)(c)", note: "Contract provisions on data integrity and confidentiality", confidence: verified, url: "https://www.digital-operational-resilience-act.com/Article_30.html"}
      - {fw: finos, ref: AIR-RC-001, note: "Risk: information leaked to hosted model", confidence: verified, url: "https://air-governance-framework.finos.org/risks/ri-1_information-leaked-to-hosted-model.html"}
      - {fw: nist_600_1, ref: MG-4.1-006, note: "Track dataset deletions and rectifications", confidence: verified}
      - {fw: aiuc1, ref: A001, note: "Input data policy on training use, retention and customer rights; enforced retention and deletion", confidence: verified, url: "https://standard.aiuc-1.com/data-and-privacy/establish-data-use-policy"}
      - {fw: aiuc1, ref: A002, note: "Output ownership, opt-out and deletion policy", confidence: verified, url: "https://standard.aiuc-1.com/data-and-privacy/define-output-rights"}
      - {fw: soc2, ref: C1.2, note: "Dispose of confidential information per objectives (confidentiality, if in scope)", confidence: verified}

  - id: DAT-02
    group: DAT
    origin: derived
    derived_from: DAT-01 and ACT-01
    question: What personal or confidential data ends up inside your agent action records, and how is it minimized, redacted or protected?
    why: Detailed action records are a second copy of customer data. Reviewers will ask the same data questions about the records as about the product.
    evidence:
      - Field-level redaction or hashing of sensitive arguments before records are stored.
      - Documented data classes per record field.
      - Access and retention rules for records match the data policy.
    not_enough:
      - Full request and response bodies logged by default.
    strong_answer: >-
      Redacts or hashes sensitive fields before records are stored, documents the data classes per record field, and
      applies the same access and retention rules to records as to the product.
    template_answer: >-
      Before a record is stored, [fields, e.g. card numbers, account numbers] are [redacted / hashed]. The data
      classes per record field are documented in [document]. Records follow the same access and retention rules as
      your other data with us.
    often_unevidenced: false
    capabilities: [redaction]
    references:
      - {fw: nydfs_ai, ref: Data management, note: "Data minimization", confidence: verified}
      - {fw: finos, ref: AIR-PREV-014, note: "Encryption of AI data at rest", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-14_encryption-of-ai-data-at-rest.html"}
      - {fw: finos, ref: AIR-DET-001, note: "Data leakage prevention and detection", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-1_ai-data-leakage-prevention-and-detection.html"}
      - {fw: aicm, ref: DSP-12, note: "Limitation of purpose", confidence: title-only}
      - {fw: dora, ref: "Art. 30(2)(c)", note: "Data confidentiality provisions", confidence: verified, url: "https://www.digital-operational-resilience-act.com/Article_30.html"}
      - {fw: aiuc1, ref: A006, note: "Prevent personal data leakage through outputs and logs", confidence: verified, url: "https://standard.aiuc-1.com/data-and-privacy/prevent-pii-leakage"}
      - {fw: aiuc1, ref: E015.3, note: "Data sanitation in log storage", confidence: verified, url: "https://standard.aiuc-1.com/accountability/log-model-activity"}
      - {fw: soc2, ref: C1.1, note: "Identify and maintain confidential information (confidentiality, if in scope)", confidence: verified}

  # ---------------------------------------------------------------- HUM
  - id: HUM-01
    group: HUM
    origin: buyer-question
    question: Under the oversight model we define for this use case, which agent actions need human review, and can you show that the review happened whenever it was required?
    why: The buyer chooses how much oversight a use case needs (by risk, amount, customer impact). What it needs from the vendor is evidence that its chosen model was followed, including that review came before execution where the buyer requires that.
    evidence:
      - Oversight rules expressed as configuration the buyer can read and change.
      - Per-action record showing whether review applied, who reviewed, the decision, and its timing relative to execution.
      - An exceptions report for actions that should have been reviewed but were not.
    not_enough:
      - A workflow screenshot.
      - A statement that "humans are in the loop".
    strong_answer: >-
      Expresses the buyer's oversight rules as readable configuration, records per action whether review applied,
      who reviewed, the decision and its timing relative to execution, and reports exceptions.
    template_answer: >-
      Your oversight rules are configured as [rules, e.g. review for refunds above EUR X], visible and editable by
      you in [place]. For each action the record shows whether review applied, who reviewed, the decision, and the
      time of review relative to execution. Actions that should have been reviewed but were not appear in
      [exceptions report].
    scanner:
      check: >-
        Where the buyer requires human review, can you show per action who reviewed it, the decision, and that it
        came before execution?
      gap: >-
        The buyer chooses its oversight rules. Without per-action proof, you can't show those rules were actually
        followed.
    often_unevidenced: true
    capabilities: [review_record, action_record]
    references:
      - {fw: naic, ref: "Sec. 3 (risk factors)", note: "Extent of human involvement in final decisions", confidence: verified}
      - {fw: nydfs_ai, ref: Training, note: "When human review must be part of verification", confidence: verified}
      - {fw: nist_rmf, ref: GOVERN 3.2; MAP 3.5, note: "Human-AI roles and oversight processes defined", confidence: verified}
      - {fw: eu_ai_act, ref: "Art. 14", note: "Human oversight measures for high-risk systems", confidence: verified, url: "https://artificialintelligenceact.eu/article/14/"}
      - {fw: finos, ref: AIR-PREV-024, note: "Where a gate is used, a tamper-evident approval record bound to the action", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-24_human-in-the-loop-action-approval-gate.html"}
      - {fw: aicm, ref: GRC-15; IAM-04, note: "Human supervision; separation of duties", confidence: title-only}
      - {fw: iso42001, ref: A.9.2, note: "Processes for responsible use", confidence: secondary}
      - {fw: aiuc1, ref: D003.4, note: "Human approval for sensitive tool operations (core control since Oct 2026)", confidence: verified, url: "https://standard.aiuc-1.com/reliability/restrict-unsafe-tool-calls"}
      - {fw: aiuc1, ref: E015.2, note: "Approval records linked to execution: approver, timestamp, decision (supplemental)", confidence: verified, url: "https://standard.aiuc-1.com/accountability/log-model-activity"}
      - {fw: aiuc1, ref: C007, note: "Flag high-risk outputs for human review", confidence: verified, url: "https://standard.aiuc-1.com/safety/flag-high-risk-recommendations"}
      - {fw: aarm, ref: R4, note: "STEP_UP blocks the action until an approver decides; deny on timeout recommended", confidence: verified, url: "https://arxiv.org/abs/2602.09433"}
      - {fw: aarm, ref: R5, note: "Receipt records approver identity, decision and timestamp", confidence: verified, url: "https://arxiv.org/abs/2602.09433"}

  - id: HUM-02
    group: HUM
    origin: buyer-question
    question: What audit trail exists when a person overrides, corrects or reverses what the agent did or recommended?
    why: Overrides show where the agent is wrong and who took responsibility. Both matter in a dispute.
    evidence:
      - Override records linked to the original action, with who, when, what changed and why.
      - Override rates reported over time.
    not_enough:
      - Overrides visible only as a later edit in the target system.
    strong_answer: >-
      Links each override to the original action with who, when, what changed and why, and reports override rates
      over time.
    template_answer: >-
      When someone overrides, corrects or reverses an agent action, we record who, when, what changed and why,
      linked to the original action record. Override rates are included in your [period] report.
    often_unevidenced: false
    capabilities: [review_record]
    references:
      - {fw: nist_rmf, ref: MANAGE 4.1; MEASURE 3.3, note: "Appeal and override in monitoring; feedback channels", confidence: verified}
      - {fw: eu_ai_act, ref: "Art. 14(4)(d)", note: "Overseers can disregard, override or reverse output (high-risk)", confidence: verified, url: "https://artificialintelligenceact.eu/article/14/"}
      - {fw: aicm, ref: IAM-18, note: "Output modification and special authorization", confidence: title-only}
      - {fw: finos, ref: AIR-DET-011, note: "Human feedback loop", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-11_human-feedback-loop-for-ai-systems.html"}
      - {fw: aiuc1, ref: C009, note: "Real-time user intervention; intervention logs reviewed (supplemental)", confidence: verified, url: "https://standard.aiuc-1.com/safety/collect-real-time-feedback"}

  # ---------------------------------------------------------------- SUB
  - id: SUB-01
    group: SUB
    origin: buyer-question
    question: Which model, voice, speech-to-text, text-to-speech and tool providers are involved, and what are their data retention and training terms?
    why: Nth-party risk is its own category in bank AI due diligence. Each provider is another place customer data can go.
    evidence:
      - Complete sub-processor list including AI providers, with region and purpose.
      - Each provider's retention and training terms.
      - Notice process for sub-processor changes.
    not_enough:
      - '"No subprocessors available."'
    strong_answer: >-
      Publishes a complete sub-processor list that includes AI, voice and tool providers with region and purpose,
      with each provider's retention and training terms, and a change notice process.
    template_answer: >-
      Sub-processors involved in the agent: [provider, purpose, region, retention, training terms] for each of
      model, speech-to-text, text-to-speech and tools. The full list is at [link]. We notify you [N days] before
      adding or changing one.
    scanner:
      check: >-
        Do you publish a complete list of model, voice and tool providers, with their retention and training terms?
      gap: >-
        Every provider is another place customer data goes. Missing or incomplete lists stall third-party risk
        review.
    often_unevidenced: false
    capabilities: []
    references:
      - {fw: fsisac, ref: Category 6, note: "Nth-party risk and usage", confidence: verified}
      - {fw: nydfs500, ref: "500.11(a)", note: "Third-party service provider security policy", confidence: verified, url: "https://www.law.cornell.edu/regulations/new-york/23-NYCRR-500.11"}
      - {fw: nydfs_ai, ref: TPSP and vendor management, note: "Diligence on third parties' AI", confidence: verified}
      - {fw: aicm, ref: DSP-14; STA-08; STA-09; STA-16, note: "Sub-processor disclosure, supply-chain inventory and risk, service BOM", confidence: title-only}
      - {fw: iso42001, ref: A.10.2; A.10.3, note: "Allocating responsibilities; suppliers", confidence: secondary}
      - {fw: nist_rmf, ref: GOVERN 6.1; MAP 4.1, note: "Third-party AI risk policies and component mapping", confidence: verified}
      - {fw: dora, ref: "Art. 28(3); Art. 30(2)(b); RTS 2025/532", note: "Register, locations, subcontracting conditions", confidence: secondary, url: "https://www.digital-operational-resilience-act.com/Article_28.html"}
      - {fw: finos, ref: AIR-SEC-026, note: "Risk: MCP server supply chain compromise", confidence: verified, url: "https://air-governance-framework.finos.org/risks/ri-26_mcp-server-supply-chain-compromise.html"}
      - {fw: aiuc1, ref: E006, note: "Due diligence on foundation and upstream model providers: data handling, PII, security", confidence: verified, url: "https://standard.aiuc-1.com/accountability/conduct-vendor-due-diligence"}
      - {fw: aiuc1, ref: E011, note: "Document AI data processing locations", confidence: verified, url: "https://standard.aiuc-1.com/accountability/record-processing-locations"}
      - {fw: soc2, ref: CC9.2, note: "Assess and manage risks from vendors and business partners", confidence: verified}

  - id: SUB-02
    group: SUB
    origin: buyer-question
    question: What audit rights or audit reports cover the AI system itself, not just your infrastructure?
    why: Insurers and banks are expected to secure audit rights over third-party AI. A SOC 2 report usually covers infrastructure and access, not agent behaviour.
    evidence:
      - Audit-rights clause covering the AI system.
      - Reports whose scope includes agent behaviour, plus record samples the buyer can verify.
    not_enough:
      - A SOC 2 report alone.
    strong_answer: >-
      Grants audit rights that cover the AI system itself and provides reports whose scope includes agent behaviour,
      together with record samples the buyer can verify.
    template_answer: >-
      [Contract clause] gives you audit rights over the AI system, including [model use, agent actions, records].
      Our [SOC 2 Type II / other report] covers [scope]. For agent behaviour we provide verifiable record samples
      for any period you choose.
    often_unevidenced: true
    capabilities: [pack]
    references:
      - {fw: naic, ref: "Sec. 3, 4.2(a); 4.3", note: "Audit rights or audit reports; exercise of audit rights", confidence: verified}
      - {fw: nydfs_cl7, ref: "¶37", note: "Audit rights or reports in vendor contracts", confidence: verified}
      - {fw: dora, ref: "Art. 28(6); Art. 30(3)(e)", note: "Audits; access, inspection and audit rights", confidence: verified, url: "https://www.digital-operational-resilience-act.com/Article_30.html"}
      - {fw: fsisac, ref: Level 3, note: "Audit validation", confidence: verified}
      - {fw: aicm, ref: A&A-02, note: "Independent assessments", confidence: title-only}
      - {fw: nist_600_1, ref: GV-6.1-006, note: "Clauses allowing evaluation of third-party processes", confidence: verified}

  - id: SUB-03
    group: SUB
    origin: buyer-question
    question: Will you cooperate with regulatory inquiries and give examiners access to the documentation and records they ask for?
    why: Regulators examine the buyer, and through the buyer, its AI vendors. Buyers need the cooperation in writing and the artifacts ready.
    evidence:
      - Regulatory cooperation clause.
      - 'A ready evidence package: model documentation, validation, change history and verifiable action records.'
    not_enough:
      - Best-effort cooperation with no artifacts.
    strong_answer: >-
      Commits in writing to cooperate with regulators and keeps an evidence package ready: model documentation,
      validation, change history and verifiable action records.
    template_answer: >-
      [Contract clause] commits us to cooperate with your regulators and to give examiners access to documentation
      and records. We keep an evidence package ready: model documentation, validation results, change history and
      verifiable action records, deliverable within [time].
    often_unevidenced: false
    capabilities: [pack]
    references:
      - {fw: naic, ref: "Sec. 3, 4.2(b); Sec. 4", note: "Cooperation with regulatory inquiries; documents regulators may request", confidence: verified}
      - {fw: nydfs_cl7, ref: "¶9; ¶37", note: "DFS exam authority; cooperation clause", confidence: verified}
      - {fw: dora, ref: "Art. 30(2)(g)", note: "Full cooperation with competent authorities", confidence: verified, url: "https://www.digital-operational-resilience-act.com/Article_30.html"}
      - {fw: eu_ai_act, ref: "Art. 18", note: "Provider documentation kept for authorities", confidence: verified, url: "https://artificialintelligenceact.eu/article/18/"}
      - {fw: iso42001, ref: A.8.5, note: "Information for interested parties incl. regulators", confidence: secondary}
