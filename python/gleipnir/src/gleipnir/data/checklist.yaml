items:

  # ---------------------------------------------------------------- ACC
  - id: ACC-01
    group: ACC
    origin: buyer-question
    question: What actions can your agent take in our systems, and how are those permissions enforced at the moment a tool is called?
    why: The buyer stays responsible for everything that happens in its systems. An agent acting outside its intended authority is a named risk in agent frameworks, and instructions in a prompt are not an enforcement mechanism.
    evidence:
      - Per-agent inventory of tools and actions, with the systems and scopes each one can touch.
      - Enforcement in code at the tool-invocation layer (allowlists, parameter validation, scoped credentials), not only in the prompt.
      - Test results showing out-of-scope calls are blocked.
      - Per-action records that show which scope or permission applied.
    not_enough:
      - "The model is instructed not to do X."
      - A workflow diagram with no enforcement point.
    strong_answer: >-
      Names every tool the agent can call and the scope of each, shows that limits are enforced in code where the
      tool is invoked (not in the prompt), and offers test results plus a sample action record that shows the scope
      applied.
    template_answer: >-
      The agent can call [N] tools: [list tool, target system and allowed operations, e.g. "issue_refund on the
      payment provider, up to EUR 200 per refund"]. Each call passes through [enforcement layer, e.g. a tool
      gateway] that checks [allowlist, parameter limits, scoped credential] before execution; calls outside scope
      are [blocked and logged / describe what happens]. We test this in [CI suite / quarterly test], last run
      [date], results attached. Each action record stores [the scope that applied] (sample attached).
    scanner:
      check: >-
        Are your agent's tool permissions enforced in code at the moment of each call, not only in the prompt?
      gap: >-
        Without a hard limit at the tool layer, a confused or manipulated agent can take actions you never intended,
        and a reviewer has nothing to test.
    often_unevidenced: false
    capabilities: [scope_record, action_record]
    references:
      - {fw: finos, ref: AIR-PREV-018, note: "Agent authority least privilege", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-18_agent-authority-least-privilege-framework.html"}
      - {fw: finos, ref: AIR-SEC-024, note: "Risk: agent action authorization bypass", confidence: verified, url: "https://air-governance-framework.finos.org/risks/ri-24_agent-action-authorization-bypass.html"}
      - {fw: finos, ref: AIR-PREV-019, note: "Tool chain validation and sanitization", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-19_tool-chain-validation-and-sanitization.html"}
      - {fw: aicm, ref: IAM-19, note: "Agent access restriction", confidence: title-only}
      - {fw: aicm, ref: AIS-11, note: "Agents security boundaries", confidence: title-only}
      - {fw: aicm, ref: IAM-05, note: "Least privilege", confidence: title-only}
      - {fw: nydfs500, ref: "500.7(a)", note: "Limit access and privileged accounts to what is needed", confidence: verified, url: "https://www.law.cornell.edu/regulations/new-york/23-NYCRR-500.7"}
      - {fw: nydfs_ai, ref: Access controls, note: "Least privilege and access review apply to AI", confidence: verified}
      - {fw: iso42001, ref: A.9.4, note: "Intended use of the AI system", confidence: secondary}
      - {fw: dora, ref: "Art. 9(4)", note: "Least-privilege access and strong authentication", confidence: verified, url: "https://www.digital-operational-resilience-act.com/Article_9.html"}
      - {fw: sig, ref: AI domain, note: "Domain-level only; question text not reviewed", confidence: title-only}
      - {fw: aiuc1, ref: B006, note: "Technical limits on agent actions to authorized scope, with alerting on boundary breaches", confidence: verified, url: "https://standard.aiuc-1.com/security/enforce-contextual-access-controls"}
      - {fw: aiuc1, ref: D003.1, note: "Tool call validation and authorization", confidence: verified, url: "https://standard.aiuc-1.com/reliability/restrict-unsafe-tool-calls"}
      - {fw: aiuc1, ref: A003, note: "Limit agent data access by task, user role, agent role and context", confidence: verified, url: "https://standard.aiuc-1.com/data-and-privacy/implement-contextual-data-safeguards"}
      - {fw: aarm, ref: R1, note: "Intercept actions before execution; denied actions must have no effect, no fail-open mode", confidence: verified, url: "https://arxiv.org/abs/2602.09433"}
      - {fw: aarm, ref: R9, note: "Should scope credentials per action (just-in-time, operation-specific)", confidence: verified, url: "https://arxiv.org/abs/2602.09433"}
      - {fw: soc2, ref: CC6.1, note: "Logical access controls protect information assets", confidence: verified}
      - {fw: soc2, ref: CC6.3, note: "Access granted by role, with least privilege and segregation of duties", confidence: verified}

  - id: ACC-02
    group: ACC
    origin: buyer-question
    question: For every write in our systems, which identity performed it? Which agent and version, under which credential and scope, on whose behalf?
    why: Agents often act through shared service accounts or human-style browser logins, so the buyer's own logs cannot tell the agent from a staff member, and the vendor's logs cannot be matched to the buyer's.
    evidence:
      - A distinct non-human identity per agent deployment, visible in the buyer's system logs.
      - Each action record carries agent ID and version, credential ID (never the secret), scope, and the initiating user, case or ticket.
      - Credentials isolated from the model and injected per call.
    not_enough:
      - A shared integration user for all agent traffic.
      - Identity known only inside the vendor's database.
    strong_answer: >-
      Each agent deployment has its own non-human identity in the buyer's systems, credentials are kept away from
      the model, and every action record carries agent ID and version, credential ID, scope and the user, case or
      ticket it acted for, so the buyer's logs and the vendor's records can be joined.
    template_answer: >-
      Agent actions in your [system] run under [a dedicated identity per deployment, name / a shared account:
      describe], which appears in your audit logs as [identity]. Every action record contains [agent ID, agent
      version, credential ID (never the secret), scope, initiating user / case / ticket ID]. Credentials are held in
      [vault / KMS] and [injected per call so the model never sees them / describe how exposure is limited]. A
      sample record joined to your system log is attached.
    scanner:
      check: >-
        Does each agent deployment act under its own identity, recorded on every action with agent version,
        credential and scope?
      gap: >-
        If the agent shares an account with staff, nobody can tell from the buyer's logs whether a person or the
        agent made a change.
    often_unevidenced: true
    capabilities: [identity_binding, action_record]
    references:
      - {fw: finos, ref: AIR-PREV-023, note: "Agentic credential protection, signed agent API requests", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-23_agentic-system-credential-protection-framework.html"}
      - {fw: finos, ref: AIR-DET-021, note: "Log decision initiation, including the triggering event and context", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-21_agent-decision-audit-and-explainability.html"}
      - {fw: finos, ref: AIR-SEC-029, note: "Risk: agent-mediated credential harvesting", confidence: verified, url: "https://air-governance-framework.finos.org/risks/ri-29_agent-mediated-credential-discovery-and-harvesting.html"}
      - {fw: aicm, ref: IAM-13, note: "Uniquely identifiable users, including non-human", confidence: title-only}
      - {fw: aicm, ref: IAM-19, note: "Agent access restriction", confidence: title-only}
      - {fw: aicm, ref: LOG-12, note: "Access control logs", confidence: title-only}
      - {fw: nydfs500, ref: "500.7(a)", note: "Access privileges and management", confidence: verified, url: "https://www.law.cornell.edu/regulations/new-york/23-NYCRR-500.7"}
      - {fw: nydfs500, ref: "500.11(b)(1)", note: "Third-party access control guidelines", confidence: verified, url: "https://www.law.cornell.edu/regulations/new-york/23-NYCRR-500.11"}
      - {fw: aiuc1, ref: A003.2, note: "Agent identity management (supplemental)", confidence: verified, url: "https://standard.aiuc-1.com/data-and-privacy/implement-contextual-data-safeguards"}
      - {fw: aiuc1, ref: E015.2, note: "Agent provenance metadata per execution, e.g. agent type and deployment origin (supplemental)", confidence: verified, url: "https://standard.aiuc-1.com/accountability/log-model-activity"}
      - {fw: aarm, ref: R6, note: "Bind each action to human principal, service identity, agent identity and privilege scope", confidence: verified, url: "https://arxiv.org/abs/2602.09433"}
      - {fw: soc2, ref: CC6.2, note: "Users registered and authorized before credentials are issued", confidence: verified}
      - {fw: soc2, ref: CC6.3, note: "Access granted by role, with least privilege and segregation of duties", confidence: verified}

  - id: ACC-03
    group: ACC
    origin: buyer-question
    question: What stops prompt injection or a manipulated tool chain from causing the agent to take an action in our systems?
    why: Agents read untrusted content (emails, documents, web pages, tool outputs). If that content can steer a tool call, an attacker can act inside the buyer's systems through the agent.
    evidence:
      - Separation of instructions from untrusted data, plus input and output filtering.
      - Validation of tool selection and parameters before execution.
      - Red-team results that include indirect injection through retrieved content.
      - Detection of out-of-pattern actions in the action records.
    not_enough:
      - "We use a safe model."
    strong_answer: >-
      Treats retrieved content as untrusted, filters inputs and outputs, validates tool choice and parameters before
      execution independently of the model, has red-team results that include indirect injection, and can detect
      unusual actions after the fact.
    template_answer: >-
      Untrusted content ([emails, documents, web pages, tool outputs]) is kept separate from instructions by
      [method], and inputs and outputs are filtered by [method]. Before any tool call, [validator] checks tool
      choice and parameters against [policy]; [how you prevent the model from bypassing it, and how that is tested].
      Our last red-team exercise on [date], by [internal team / third party], covered [direct and indirect
      injection]; a summary is attached. Unusual actions are flagged by [rule / monitor].
    often_unevidenced: false
    capabilities: []
    references:
      - {fw: finos, ref: AIR-SEC-025, note: "Risk: tool chain manipulation and injection", confidence: verified, url: "https://air-governance-framework.finos.org/risks/ri-25_tool-chain-manipulation-and-injection.html"}
      - {fw: finos, ref: AIR-SEC-010, note: "Risk: prompt injection", confidence: verified, url: "https://air-governance-framework.finos.org/risks/ri-10_prompt-injection.html"}
      - {fw: finos, ref: AIR-PREV-019, note: "Tool chain validation and sanitization", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-19_tool-chain-validation-and-sanitization.html"}
      - {fw: finos, ref: AIR-PREV-003, note: "User/app/model firewalling and filtering", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-3_user-app-model-firewalling-filtering.html"}
      - {fw: aicm, ref: AIS-15, note: "Prompt differentiation", confidence: title-only}
      - {fw: aicm, ref: AIS-08 / AIS-09, note: "Input and output validation", confidence: title-only}
      - {fw: aicm, ref: MDS-06 / MDS-07, note: "Adversarial attack analysis and robustness", confidence: title-only}
      - {fw: nist_600_1, ref: MS-2.7-007, note: "Red-team for prompt injection and related attacks", confidence: verified}
      - {fw: nist_rmf, ref: MEASURE 2.7, note: "Security and resilience evaluated and documented", confidence: verified}
      - {fw: eu_ai_act, ref: "Art. 15(5)", note: "Resilience against manipulation of inputs and outputs (high-risk)", confidence: verified, url: "https://artificialintelligenceact.eu/article/15/"}
      - {fw: aiuc1, ref: B002, note: "Detect and respond to adversarial inputs and prompt injection attempts", confidence: verified, url: "https://standard.aiuc-1.com/security/detect-adversarial-input"}
      - {fw: aiuc1, ref: B005, note: "Filter inputs before they reach the model", confidence: verified, url: "https://standard.aiuc-1.com/security/implement-real-time-input-filtering"}
      - {fw: aarm, ref: R3, note: "Evaluate each action against static policy and alignment with the user's stated intent", confidence: verified, url: "https://arxiv.org/abs/2602.09433"}

  # ---------------------------------------------------------------- ACT
  - id: ACT-01
    group: ACT
    origin: buyer-question
    question: For any single agent action, can you produce the complete record? What triggered it, which inputs and sources it used, the exact tool call and arguments, the system's response, and the downstream effect.
    why: Reviewers and examiners pick one case and ask you to walk through it. If the record is spread across chat transcripts, APM traces and the vendor UI, the answer takes days and cannot be checked.
    evidence:
      - A per-action record with trigger, inputs, retrieved sources, tool name, arguments (redacted where needed), the system response, timestamps and a trace ID.
      - A sample export for one real (redacted) case, produced on request in minutes.
    not_enough:
      - A chat transcript without the tool calls.
      - Infrastructure logs only.
    strong_answer: >-
      Can pick any action and produce, in minutes, one record with trigger, inputs and sources, exact tool call and
      arguments, the system's response, timestamps and trace ID, with sensitive fields redacted.
    template_answer: >-
      Every action produces one record containing: trigger ([event / user request]), inputs and retrieved sources,
      tool name and arguments (with [fields] redacted), the target system's response, timestamps and trace ID. We
      can export the full record for any action or case within [time]. A redacted example for one real case is
      attached.
    scanner:
      check: >-
        For any single action, can you produce the full record (trigger, inputs, tool call, arguments, system
        response) within minutes?
      gap: >-
        Reviewers pick one case and ask you to walk through it. If that takes days of digging, they assume the
        record doesn't exist.
    often_unevidenced: true
    capabilities: [action_record]
    references:
      - {fw: finos, ref: AIR-DET-021, note: "Log inputs, reasoning, tool selection, actions taken and downstream effects", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-21_agent-decision-audit-and-explainability.html"}
      - {fw: aicm, ref: LOG-11, note: "Transaction/activity logging", confidence: title-only}
      - {fw: aicm, ref: LOG-08, note: "Log records contain relevant security information", confidence: secondary}
      - {fw: aicm, ref: LOG-14 / LOG-15, note: "AI input and output monitoring", confidence: title-only}
      - {fw: eu_ai_act, ref: "Art. 12(1)-(2)", note: "Automatic event logging over the lifetime that enables traceability (high-risk)", confidence: verified, url: "https://artificialintelligenceact.eu/article/12/"}
      - {fw: iso42001, ref: A.6.2.8, note: "AI system recording of event logs", confidence: secondary}
      - {fw: nydfs500, ref: "500.6(a)(1)", note: "Systems able to reconstruct material financial transactions", confidence: verified, url: "https://www.law.cornell.edu/regulations/new-york/23-NYCRR-500.6"}
      - {fw: naic, ref: "Sec. 3, 3.3(b)-(c)", note: "Model documentation, traceability and auditability", confidence: verified}
      - {fw: nydfs_cl7, ref: "¶19", note: "Be able to explain at all times how the AIS operates", confidence: verified}
      - {fw: aiuc1, ref: E015, note: "Mandatory logging of AI system processes, actions and agent outputs for investigation and audit", confidence: verified, url: "https://standard.aiuc-1.com/accountability/log-model-activity"}
      - {fw: aiuc1, ref: E015.2, note: "Tool call parameters and results, sub-agent delegations, approvals and reasoning traces (supplemental)", confidence: verified, url: "https://standard.aiuc-1.com/accountability/log-model-activity"}
      - {fw: aiuc1, ref: D003.3, note: "Tool call log", confidence: verified, url: "https://standard.aiuc-1.com/reliability/restrict-unsafe-tool-calls"}
      - {fw: aarm, ref: R5, note: "Signed receipt per action with tool, parameters, context, identity, decision and outcome", confidence: verified, url: "https://arxiv.org/abs/2602.09433"}
      - {fw: soc2, ref: PI1.3, note: "Controls over processing (processing integrity, if in scope)", confidence: verified}

  - id: ACT-02
    group: ACT
    origin: buyer-question
    question: Which model and version handled a given action, including actions served by versions you have since retired?
    why: Vendors route between several models and providers. When a past decision is challenged, the buyer must know which model produced it, even if that model is gone.
    evidence:
      - Model provider, model name and pinned version stored on every action record.
      - A model inventory that keeps retired versions with their active dates.
    not_enough:
      - A current list of providers with no per-action version.
    strong_answer: >-
      Stores the provider, model name and pinned version on every action record, and keeps an inventory of retired
      versions with the dates they were in use.
    template_answer: >-
      Each action record stores model provider, model name and pinned version, e.g. [example]. We keep a model
      inventory including retired versions and their active dates ([link / attachment]), so any past action can be
      matched to the model that handled it.
    scanner:
      check: >-
        Is the exact model and version stored on every action, including versions you have since retired?
      gap: >-
        When a past decision is challenged, you can't say which model made it, so you can't explain or defend it.
    often_unevidenced: true
    capabilities: [model_version, action_record]
    references:
      - {fw: finos, ref: AIR-PREV-010, note: "AI model version pinning", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-10_ai-model-version-pinning.html"}
      - {fw: finos, ref: AIR-OP-005, note: "Risk: foundation model versioning", confidence: verified, url: "https://air-governance-framework.finos.org/risks/ri-5_foundation-model-versioning.html"}
      - {fw: nist_600_1, ref: GV-1.6-003, note: "Inventory records underlying models and versions", confidence: verified}
      - {fw: nist_rmf, ref: GOVERN 1.6 / 1.7, note: "AI inventory and decommissioning", confidence: verified}
      - {fw: naic, ref: "Sec. 3, 3.3(a)", note: "Model inventory", confidence: verified}
      - {fw: nydfs_cl7, ref: "¶29", note: "Inventory including retired AIS, with change tracking", confidence: verified}
      - {fw: aicm, ref: MDS-03 to MDS-05, note: "Model documentation", confidence: title-only}
      - {fw: aicm, ref: MDS-09, note: "Model signing and ownership verification", confidence: title-only}

  - id: ACT-03
    group: ACT
    origin: buyer-question
    question: Show every model endpoint and external service the agent actually called for our traffic, not just the list in your inventory.
    why: An inventory says what should be called. Destination records show what was called, which is what data-flow and data-residency reviews need.
    evidence:
      - Per-action record of each outbound call (provider, endpoint, region).
      - A periodic summary per buyer comparing actual destinations with the declared sub-processor list.
    not_enough:
      - A static sub-processor page.
    strong_answer: >-
      Records each outbound call per action (provider, endpoint, region) and periodically compares actual
      destinations with the declared sub-processor list for that buyer.
    template_answer: >-
      Each action record lists the outbound calls made: [provider, endpoint, region]. Every [month / quarter] we
      compare actual destinations for your traffic with the declared sub-processor list and share the result. The
      latest comparison is attached.
    often_unevidenced: true
    capabilities: [endpoint_record]
    references:
      - {fw: aicm, ref: STA-16, note: "Service bill of materials", confidence: title-only}
      - {fw: aicm, ref: DSP-05, note: "Data flow documentation", confidence: title-only}
      - {fw: finos, ref: AIR-DET-004, note: "AI system observability, centralized logs", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-4_ai-system-observability.html"}
      - {fw: finos, ref: AIR-PREV-020, note: "Log all MCP traffic", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-20_mcp-server-security-governance.html"}
      - {fw: nydfs_ai, ref: Monitoring, note: "Monitor AI tool use for unusual query behaviour", confidence: verified}
      - {fw: dora, ref: "Art. 30(2)(b)", note: "Contract specifies data processing locations and notice of changes", confidence: verified, url: "https://www.digital-operational-resilience-act.com/Article_30.html"}
      - {fw: aiuc1, ref: E009, note: "Log third-party API connections, sessions and data access", confidence: verified, url: "https://standard.aiuc-1.com/accountability/monitor-3rd-party-access"}

  - id: ACT-04
    group: ACT
    origin: buyer-question
    question: Which documents and records contributed to each answer or action?
    why: Reviewers need to trace an output back to its sources, both to check correctness and to confirm the agent only used data it was entitled to see.
    evidence:
      - Source IDs (document, record, version) stored on the action record.
      - Entitlement checks that carry the source system's access controls into retrieval.
    not_enough:
      - Citations shown in the UI but not retained.
    strong_answer: >-
      Stores the ID and version of each document or record the agent used, and retrieval respects the access
      controls of the source system.
    template_answer: >-
      For each answer or action we store the IDs and versions of the sources used ([document IDs, record IDs]).
      Retrieval runs under [the requesting user's permissions / a scoped identity], so the agent only sees what
      [that user / that scope] is entitled to. An example record with sources is attached.
    often_unevidenced: false
    capabilities: [source_record]
    references:
      - {fw: finos, ref: AIR-DET-013, note: "Citations and source traceability", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-13_providing-citations-and-source-traceability-for-ai-generated-information.html"}
      - {fw: finos, ref: AIR-DET-016, note: "Preserve source data access controls", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-16_preserving-source-data-access-controls-in-ai-systems.html"}
      - {fw: aicm, ref: DSP-20, note: "Data provenance and transparency", confidence: title-only}
      - {fw: iso42001, ref: A.7.5, note: "Data provenance", confidence: secondary}

  - id: ACT-05
    group: ACT
    origin: buyer-question
    question: What is the lineage of the data used in a decision? Where did each input come from, and how current was it?
    why: Insurance and lending regulators ask for data lineage, and stale or wrong inputs are a common root cause of bad decisions.
    evidence:
      - Documented data flows per use case.
      - Input source and retrieval timestamp stored with the decision.
    not_enough:
      - A generic architecture diagram.
    strong_answer: >-
      Documents data flows per use case and stores, with each decision, where every input came from and when it was
      retrieved.
    template_answer: >-
      For [use case], inputs come from [sources]. A data-flow diagram is attached. With each decision we store the
      source and retrieval time of every input, so you can see how current the data was at the time.
    often_unevidenced: false
    capabilities: []
    references:
      - {fw: naic, ref: "Sec. 3, 3.2", note: "Data practices incl. lineage and integrity", confidence: verified}
      - {fw: nydfs_cl7, ref: "¶29", note: "Documentation of inputs and their sources", confidence: verified}
      - {fw: iso42001, ref: A.7.5, note: "Data provenance", confidence: secondary}
      - {fw: aicm, ref: DSP-20, note: "Data provenance and transparency", confidence: title-only}
      - {fw: nist_600_1, ref: GV-6.1-008, note: "Records of third-party content changes with sources and timestamps", confidence: verified}

  - id: ACT-06
    group: ACT
    origin: buyer-question
    question: For an adverse decision, can you give the specific reasons and the data relied on? A proprietary model is not an acceptable reason to withhold them.
    why: Consumer-facing lenders and insurers must give specific reasons for adverse outcomes, and regulators reject vendor secrecy as an excuse.
    evidence:
      - Reason codes and the specific inputs relied on, stored per decision.
      - A sample adverse-decision explanation produced from the stored record.
    not_enough:
      - Global feature importance for the model.
    strong_answer: >-
      Stores reason codes and the specific inputs relied on for each decision, and can produce an explanation for a
      specific adverse outcome from that record.
    template_answer: >-
      For each decision we store reason codes ([list or link]) and the specific inputs relied on. An explanation for
      an individual adverse outcome is generated from that stored record, not reconstructed later. A redacted sample
      is attached.
    often_unevidenced: false
    capabilities: []
    references:
      - {fw: nydfs_cl7, ref: "¶39-¶40", note: "Reasons include all information relied on; no proprietary-algorithm excuse", confidence: verified}
      - {fw: nydfs_cl7, ref: "¶44", note: "Written reasons within 15 days in specified cases", confidence: verified}
      - {fw: eu_ai_act, ref: "Art. 86(1)", note: "Right to explanation for affected persons (Annex III)", confidence: verified, url: "https://artificialintelligenceact.eu/article/86/"}
      - {fw: nist_rmf, ref: MEASURE 2.9, note: "Explain and interpret output in context", confidence: verified}
      - {fw: aicm, ref: GRC-13 / GRC-14, note: "Explainability requirement and evaluation", confidence: title-only}
      - {fw: finos, ref: AIR-OP-017, note: "Risk: lack of explainability", confidence: verified, url: "https://air-governance-framework.finos.org/risks/ri-17_lack-of-explainability.html"}

  - id: ACT-07
    group: ACT
    origin: buyer-question
    question: For customer-facing agents, can you show per interaction that the conduct rules for our use case were met, such as AI disclosure, contact-time windows and contact-frequency limits?
    why: In collections, servicing and sales, a single non-compliant contact can be a violation. Buyers want per-interaction proof, not a policy that the platform enforces rules.
    evidence:
      - Per-interaction record of the disclosure given, the time in the customer's time zone, and the frequency counter at the time of contact.
      - Rule configuration and version applied to each interaction.
    not_enough:
      - "QA reviews a sample of calls."
    strong_answer: >-
      Records, per interaction, the disclosure given, the local time of contact, the contact count at that moment
      and the rule version applied, so compliance can be shown for any single contact.
    template_answer: >-
      For each interaction we record the AI disclosure given ([wording]), the time in the customer's time zone, the
      contact-frequency count at that moment, and the version of the rule set applied ([rule set]). An export for a
      sample of [N] interactions is attached.
    often_unevidenced: true
    capabilities: []
    references:
      - {fw: eu_ai_act, ref: "Art. 50(1)", note: "Inform people they are interacting with an AI system", confidence: verified, url: "https://artificialintelligenceact.eu/article/50/"}
      - {fw: aicm, ref: LOG-11, note: "Transaction/activity logging", confidence: title-only}
      - {fw: aiuc1, ref: E016, note: "Disclose AI interaction (text, voice) and when autonomous agents perform actions", confidence: verified, url: "https://standard.aiuc-1.com/accountability/implement-ai-disclosure-mechanisms"}
    note: The specific conduct rules (for example debt-collection contact limits) come from the sector law for your use case and are not mapped here.

  # ---------------------------------------------------------------- OUT
  - id: OUT-01
    group: OUT
    origin: derived
    derived_from: ACT-01 (downstream effect) and INC-01
    question: When the agent says it did something, how do you know it actually happened in our system, as described?
    why: An agent's own summary ("refund issued") is not evidence. Agents can report success while the target system shows an error, a different amount or nothing at all. Reviewers want the system of record's response next to the claim.
    evidence:
      - Each action record stores both the agent's claim and the target system's actual response (status, object ID, returned values).
      - Optional read-back that queries the system of record and records match or mismatch.
      - Mismatch rate per period, reported to the buyer.
    not_enough:
      - The agent's final message.
      - HTTP 200 without checking the returned object.
    strong_answer: >-
      Stores the agent's claim next to the target system's actual response, optionally reads the object back from
      the system of record to confirm, and reports the mismatch rate to the buyer.
    template_answer: >-
      Each action record stores both what the agent reported and the response from [target system] (status, object
      ID, returned values). For [high-impact actions, e.g. refunds] we also read the object back from [system] and
      record match or mismatch. The mismatch rate for [period] was [x] ([report attached]).
    scanner:
      check: >-
        Do you record what actually happened in the target system next to what the agent said it did?
      gap: >-
        The agent's own "done" is not proof. Without the system's response, a failed or wrong action looks the same
        as a successful one.
    often_unevidenced: true
    capabilities: [outcome_check, action_record]
    references:
      - {fw: finos, ref: AIR-DET-021, note: "Log actions taken and their downstream effects", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-21_agent-decision-audit-and-explainability.html"}
      - {fw: nydfs500, ref: "500.6(a)(1)", note: "Reconstruct material financial transactions", confidence: verified, url: "https://www.law.cornell.edu/regulations/new-york/23-NYCRR-500.6"}
      - {fw: eu_ai_act, ref: "Art. 12(2)", note: "Logs enable traceability and deployer monitoring", confidence: verified, url: "https://artificialintelligenceact.eu/article/12/"}
      - {fw: naic, ref: "Sec. 3, 3.4", note: "Validate and retest outputs after implementation", confidence: verified}
      - {fw: nist_rmf, ref: MEASURE 2.4, note: "Monitor behaviour in production", confidence: verified}
      - {fw: aiuc1, ref: E015.2, note: "Tool call results logged alongside parameters (supplemental)", confidence: verified, url: "https://standard.aiuc-1.com/accountability/log-model-activity"}
      - {fw: aarm, ref: R5, note: "Receipt includes execution result and error details, not only the decision", confidence: verified, url: "https://arxiv.org/abs/2602.09433"}
      - {fw: soc2, ref: PI1.4, note: "Output delivered completely and accurately (processing integrity, if in scope)", confidence: verified}

  - id: OUT-02
    group: OUT
    origin: derived
    derived_from: INC-02
    question: How do you detect and report actions that failed, only partly completed, or produced a different result than intended?
    why: Silent failures are the hardest to catch. A buyer wants to see failures counted and reported, not discovered by a customer.
    evidence:
      - Failed, partial and mismatched actions counted per period, with examples, in the buyer's report.
      - Alert thresholds and owners.
      - Reconciliation against the system of record for high-impact actions.
    not_enough:
      - Error rate from APM only.
    strong_answer: >-
      Counts failed, partial and mismatched actions per period with examples, has alert thresholds and owners, and
      reconciles high-impact actions against the system of record.
    template_answer: >-
      Failed, partial and mismatched actions are counted and included in your [monthly] report with examples. Alerts
      fire at [threshold] and go to [owner]. For [action types] we reconcile against [system] every [period]. The
      last report is attached.
    often_unevidenced: true
    capabilities: [outcome_check, report]
    references:
      - {fw: aicm, ref: LOG-13, note: "Failures and anomalies reporting", confidence: title-only}
      - {fw: aicm, ref: MDS-11, note: "Model failure", confidence: title-only}
      - {fw: finos, ref: AIR-DET-004, note: "Observability and alerting on anomalies", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-4_ai-system-observability.html"}
      - {fw: nist_600_1, ref: MG-4.3-002, note: "Track errors, near-misses and negative impacts", confidence: verified}
      - {fw: iso42001, ref: A.6.2.6, note: "AI system operation and monitoring", confidence: secondary}
      - {fw: dora, ref: "Art. 17(1)-(3)", note: "Detect, log, classify and track ICT incidents", confidence: verified, url: "https://www.digital-operational-resilience-act.com/Article_17.html"}
      - {fw: soc2, ref: PI1.3, note: "Controls over processing (processing integrity, if in scope)", confidence: verified}
      - {fw: soc2, ref: CC7.2, note: "Monitor components for anomalies and evaluate them", confidence: verified}

  # ---------------------------------------------------------------- TMP
  - id: TMP-01
    group: TMP
    origin: buyer-question
    question: Are agent action records protected so that any edit, deletion, reordering or truncation after the fact is detectable?
    why: Access controls protect logs from outsiders, not from the party that writes them. "Immutable" is a claim; reviewers increasingly ask for the mechanism.
    evidence:
      - Hash-chained, append-only records (each record commits to the previous one).
      - Digital signatures with keys separated from application operators.
      - Periodic commitment of segment digests (for example a Merkle root) so truncation is detectable.
      - Synchronized clocks and documented key management.
    not_enough:
      - '"Logs are immutable" with no mechanism.'
      - Write-protected storage alone, where the vendor still controls the storage.
    strong_answer: >-
      Names the mechanism: hash-chained, signed records with keys separated from operators, periodic commitments
      (for example Merkle roots) so edits, deletions, reordering and truncation are all detectable, and synchronized
      clocks.
    template_answer: >-
      Action records are [append-only and hash-chained, each record including the hash of the previous one /
      describe]. Records are signed with [algorithm] keys held in [KMS / HSM], [separate from the people who run the
      agent / describe]. Every [period] we commit a digest of the latest records [to an external log / to you], so
      [truncation is also detectable / describe]. Clocks are synchronized via [time source]. Key management is
      documented in [document].
    scanner:
      check: >-
        Would an edit, deletion or truncation of your agent records be detectable, through a mechanism like hash
        chains and signatures?
      gap: >-
        Saying "our logs are immutable" is a claim. Without a mechanism, a reviewer has no reason to believe records
        weren't changed after the fact.
    often_unevidenced: true
    capabilities: [signed_records, hash_chain]
    references:
      - {fw: finos, ref: AIR-DET-021, note: "Tamper-evident logging and immutable records; names hash chaining and signed segments", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-21_agent-decision-audit-and-explainability.html"}
      - {fw: finos, ref: AIR-PREV-024, note: "Tamper-evident approval record; hash chaining alone is not non-repudiation", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-24_human-in-the-loop-action-approval-gate.html"}
      - {fw: dora, ref: "RTS 2024/1774 Art. 12", note: "Protect logging systems and log information against tampering and deletion", confidence: secondary, url: "https://www.springlex.eu/en/packages/dora/rts-rmf-regulation/article-12/"}
      - {fw: aicm, ref: LOG-09, note: "Protect audit records from modification and deletion", confidence: secondary}
      - {fw: aicm, ref: IAM-12, note: "Safeguard logs integrity", confidence: secondary}
      - {fw: aicm, ref: LOG-02, note: "Audit logs protection", confidence: secondary}
      - {fw: aicm, ref: LOG-06, note: "Clock synchronization", confidence: title-only}
      - {fw: nist_600_1, ref: MS-2.8-003, note: "Tamper-proof history of generated content (content provenance) with version control", confidence: verified}
      - {fw: nydfs500, ref: "500.6(a)", note: "Securely maintain audit trail systems (no cryptographic requirement)", confidence: verified, url: "https://www.law.cornell.edu/regulations/new-york/23-NYCRR-500.6"}
      - {fw: aiuc1, ref: E015.4, note: "Tamper-evident logs; gaps, omissions and reordering detectable (supplemental)", confidence: verified, url: "https://standard.aiuc-1.com/accountability/log-model-activity"}
      - {fw: aarm, ref: R5, note: "Cryptographically signed receipts for all actions, over a canonical serialization", confidence: verified, url: "https://arxiv.org/abs/2602.09433"}
      - {fw: aarm, ref: R2, note: "Should keep session context as an append-only, hash-chained log", confidence: verified, url: "https://arxiv.org/abs/2602.09433"}
      - {fw: soc2, ref: PI1.5, note: "Stored inputs and outputs kept complete and accurate; names no tamper-evidence mechanism", confidence: verified}

  - id: TMP-02
    group: TMP
    origin: buyer-question
    question: Can we, our auditor or our regulator verify those records ourselves, without access to your systems and without relying on your word?
    why: Logs the vendor writes, stores and attests to are self-reported evidence. The strongest records are those a third party can check independently.
    evidence:
      - A verification tool the buyer can run offline on an exported bundle.
      - Public keys and verification steps documented.
      - Record digests anchored outside the vendor (for example an append-only transparency log) or held by the buyer.
      - A worked example showing a tampered bundle failing verification.
    not_enough:
      - A screenshot or PDF export from the vendor's UI.
      - A SOC 2 report, which covers controls, not individual records.
    strong_answer: >-
      Gives the buyer an exported bundle and a verification tool they run themselves, offline, with documented
      public keys and digests anchored outside the vendor, plus a demo of a tampered bundle failing.
    template_answer: >-
      To verify records yourself, you [run verifier, e.g. an open-source CLI, offline against an exported bundle /
      describe current process] using our published public key [key ID]. Segment digests are anchored in [external
      log / your storage], so [what a rewrite of history would show, and to whom]. A sample bundle, the verification
      steps and a tampered example that fails are attached.
    scanner:
      check: >-
        Can the buyer, their auditor or a regulator verify your records themselves, without access to your systems?
      gap: >-
        Records only you can check are self-reported. The buyer has to take your word for them, which is exactly
        what reviews try to avoid.
    often_unevidenced: true
    capabilities: [external_anchor, offline_verifier]
    references:
      - {fw: finos, ref: AIR-DET-021, note: "Records verifiable by deployer, auditor or authority without privileged access to the provider; anchoring to a transparency log", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-21_agent-decision-audit-and-explainability.html"}
      - {fw: dora, ref: "Art. 30(3)(e)", note: "Unrestricted rights of access, inspection and audit (critical or important functions)", confidence: verified, url: "https://www.digital-operational-resilience-act.com/Article_30.html"}
      - {fw: eu_ai_act, ref: "Art. 13(3)(f)", note: "Mechanisms that let deployers collect, store and interpret logs (high-risk)", confidence: verified, url: "https://artificialintelligenceact.eu/article/13/"}
      - {fw: aiuc1, ref: E015.4, note: "Logs independently verifiable (supplemental); no verification method specified", confidence: verified, url: "https://standard.aiuc-1.com/accountability/log-model-activity"}
      - {fw: aarm, ref: R5, note: "Receipt signatures verifiable offline with published public keys", confidence: verified, url: "https://arxiv.org/abs/2602.09433"}
    note: FINOS, AIUC-1 (E015.4, supplemental) and CSA AARM (R5, offline-verifiable signatures) state independent verifiability explicitly. Elsewhere it follows from audit and access rights.

  - id: TMP-03
    group: TMP
    origin: buyer-question
    question: Who at your company can read, change or delete agent records, and is that access itself logged?
    why: Privileged insiders are the main threat to record integrity. Reviewers expect named roles and an access trail.
    evidence:
      - Named roles with access to record storage and keys.
      - Access to records logged against individual identities and reviewed.
      - Separation between people who run the agent and people who can touch records or keys.
    not_enough:
      - '"Only engineers have access."'
    strong_answer: >-
      Lists the named roles with access to record storage and signing keys, logs each access against an individual
      identity, and separates people who run the agent from people who can touch records or keys.
    template_answer: >-
      Access to record storage is limited to [roles, number of people]; access to signing keys to [roles]. Every
      access is [logged against an individual identity and reviewed every period / describe]. People who operate the
      agent [cannot change records or keys / describe the separation]. The latest access review is attached.
    often_unevidenced: false
    capabilities: []
    references:
      - {fw: aicm, ref: LOG-04, note: "Audit log access restricted and attributable", confidence: secondary}
      - {fw: aicm, ref: IAM-12, note: "Logging infrastructure read-only to those with other write access", confidence: secondary}
      - {fw: aicm, ref: IAM-04, note: "Separation of duties", confidence: title-only}
      - {fw: nydfs500, ref: "500.7(c)", note: "Privileged access monitoring (Class A companies)", confidence: verified, url: "https://www.law.cornell.edu/regulations/new-york/23-NYCRR-500.7"}
      - {fw: aiuc1, ref: E015.3, note: "Log storage with access controls, retention and sanitation", confidence: verified, url: "https://standard.aiuc-1.com/accountability/log-model-activity"}
      - {fw: soc2, ref: CC6.3, note: "Access granted by role, with least privilege and segregation of duties", confidence: verified}

  # ---------------------------------------------------------------- INC
  - id: INC-01
    group: INC
    origin: buyer-question
    question: After an incident, can you reconstruct exactly what the agent did, in which of our systems, under which identity, and in what order?
    why: Incident response, root-cause analysis and regulator notifications all depend on an ordered, complete account. Gaps are what turn an incident into a finding.
    evidence:
      - For a time window or case, an ordered export of all actions across all buyer systems, with identity, scope, inputs and system responses.
      - Evidence the sequence is complete (no gaps) and unaltered.
      - A tabletop exercise or test showing how long reconstruction takes.
    not_enough:
      - "Our engineers can query the database."
    strong_answer: >-
      Can export, for any time window or case, an ordered account of every action across the buyer's systems, with
      evidence that the sequence is complete and unaltered, and knows from a test how long that takes.
    template_answer: >-
      For any time window or case we can export [every agent action across systems], in order, with [identity,
      scope, inputs and system responses]. [Mechanism, e.g. a hash chain plus externally committed digests] shows
      the exported sequence has not been altered or cut short. In our last tabletop on [date], a full reconstruction
      took [time].
    scanner:
      check: >-
        Can you reconstruct, in order and without gaps, everything the agent did across the buyer's systems during
        an incident window?
      gap: >-
        Incident reports and regulator notifications depend on a complete timeline. Gaps turn an incident into an
        audit finding.
    often_unevidenced: true
    capabilities: [action_record, hash_chain, pack]
    references:
      - {fw: finos, ref: AIR-DET-021, note: "Tier 1 is reconstruction of what happened", confidence: verified, url: "https://air-governance-framework.finos.org/mitigations/mi-21_agent-decision-audit-and-explainability.html"}
      - {fw: nydfs500, ref: "500.6(a)", note: "Audit trails to reconstruct transactions and respond to cybersecurity events", confidence: verified, url: "https://www.law.cornell.edu/regulations/new-york/23-NYCRR-500.6"}
      - {fw: nydfs500, ref: "500.16(a)(1)", note: "Incident response plan incl. documentation and root cause", confidence: verified, url: "https://www.law.cornell.edu/regulations/new-york/23-NYCRR-500.16"}
      - {fw: dora, ref: "Art. 17(1)-(3)", note: "Incident detection, logging and root-cause analysis", confidence: verified, url: "https://www.digital-operational-resilience-act.com/Article_17.html"}
      - {fw: dora, ref: "Art. 30(2)(f)", note: "Provider assists with ICT incidents", confidence: verified, url: "https://www.digital-operational-resilience-act.com/Article_30.html"}
      - {fw: eu_ai_act, ref: "Art. 73", note: "Serious incident reporting; provider must not alter the system before informing authorities", confidence: verified, url: "https://artificialintelligenceact.eu/article/73/"}
      - {fw: aicm, ref: SEF-09, note: "Incident response", confidence: title-only}
      - {fw: aicm, ref: LOG-05 / LOG-06, note: "Audit log monitoring and clock synchronization", confidence: title-only}
      - {fw: nist_rmf, ref: MANAGE 4.3, note: "Track and recover from incidents and errors", confidence: verified}
      - {fw: aiuc1, ref: E015, note: "Logs must support incident investigation and explanation of behaviour", confidence: verified, url: "https://standard.aiuc-1.com/accountability/log-model-activity"}
      - {fw: aiuc1, ref: E001, note: "Breach plan covers evidence collection and preservation for legal review", confidence: verified, url: "https://standard.aiuc-1.com/accountability/ai-failure-plan-for-security-breaches"}
      - {fw: aarm, ref: "R5 / R6", note: "Receipts with identity binding support forensic reconstruction of actions", confidence: verified, url: "https://arxiv.org/abs/2602.09433"}
      - {fw: soc2, ref: CC7.4, note: "Respond to incidents: understand, contain, remediate, communicate", confidence: verified}

  - id: INC-02
    group: INC
    origin: buyer-question
    question: How do you detect and report model failures, data leakage or harmful outputs, and on what timeline will we hear about them?
    why: The buyer has its own notification clocks (72 hours under NYDFS 500, 4 hours from classification and at most 24 hours from awareness under DORA). Vendor timelines must fit inside them.
    evidence:
      - Contractual notification timeline that fits the buyer's obligations.
      - Detection sources (monitoring, alerts, user reports) and owners.
      - A recent incident report or tabletop record (redacted).
    not_enough:
      - A generic incident-response policy with no AI-specific triggers.
    strong_answer: >-
      Commits in the contract to a notification timeline that fits inside the buyer's own regulatory clocks, names
      the detection sources and owners, and can show a recent incident or tabletop record.
    template_answer: >-
      We detect [model failures, data leakage, harmful outputs] through [monitoring, alerts, user reports], owned by
      [team]. We notify you within [hours] of detection, as set out in [contract clause], which fits within [your
      NYDFS / DORA timelines]. A redacted incident or tabletop report from [date] is attached.
    often_unevidenced: false
    capabilities: []
    references:
